# Builds the ops TUI for amd64/arm64 and attaches it to a GitHub release.
# Trigger: push a tag, e.g.  git tag v0.1.0 && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod
      - name: Build
        working-directory: tui
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o ../dist/ops-linux-$arch .
          done
          cd ../dist && sha256sum ops-linux-* > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
