# Builds the ops TUI for amd64/arm64 and publishes it as a GitHub release.
#
# Runs automatically on every push to main that changes the UI (tui/) or this file.
# The version is the latest v* tag bumped: patch by default (v0.1.4 -> v0.1.5),
# "#minor" in a commit message -> v0.2.0, "#major" -> v1.0.0. Starts at v0.1.0.
# You can also push a tag yourself (git tag v0.2.0 && git push origin v0.2.0);
# later automatic releases continue from it.
# Script-only changes don't need a release: the binary runs the scripts from your clone.
name: release

on:
  push:
    branches: [main]
    paths: ["tui/**", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the latest version

      - name: Pick version
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            v="$GITHUB_REF_NAME"
          else
            last="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
            if [[ -z "$last" ]]; then
              v=v0.1.0
            else
              IFS=. read -r major minor patch <<< "${last#v}"
              # Commit messages since the last release decide the bump.
              msgs="$(git log "$last..HEAD" --format=%B)"
              if grep -qiw -- '#major' <<< "$msgs"; then
                v="v$((major + 1)).0.0"
              elif grep -qiw -- '#minor' <<< "$msgs"; then
                v="v${major}.$((minor + 1)).0"
              else
                v="v${major}.${minor}.$((patch + 1))"
              fi
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Releasing $v"

      - uses: actions/setup-go@v5
        with:
          go-version-file: tui/go.mod

      - name: Build
        working-directory: tui
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          go vet ./...
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build \
              -ldflags "-s -w -X main.version=$VERSION" -o ../dist/ops-linux-$arch .
          done
          cd ../dist && sha256sum ops-linux-* > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # Creates the tag on this commit when it doesn't exist yet.
          gh release create "$VERSION" dist/* --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes --latest
